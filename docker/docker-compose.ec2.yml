# Déploiement sur l'EC2 partagé avec Totalis, isolé de lui : réseau, MongoDB,
# Redis et identifiants S3 propres à L'Arène. Seul hms-nginx (ports 80/443) est
# commun ; il est branché sur arene-network par `docker network connect`.
# Données en bind mount sous ARENE_DATA_DIR : le `prune --volumes` de l'hôte
# ne peut pas les effacer. Voir docker/DEPLOY.md pour la procédure complète.
#
# Prérequis : docker network create arene-network
# Usage : docker compose -f docker/docker-compose.ec2.yml --env-file .env.ec2 up -d
name: arene

networks:
  arene-network:
    external: true

services:
  web:
    image: nejishow/arene-web:${IMAGE_TAG:-latest}
    container_name: arene-web
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?domaine requis}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?domaine requis}
    networks:
      - arene-network
    expose:
      - "3000"
    depends_on:
      - api
    mem_limit: 256m
    restart: unless-stopped

  api:
    image: nejishow/arene-api:${IMAGE_TAG:-latest}
    container_name: arene-api
    environment:
      NODE_ENV: production
      API_PORT: 4000
      MONGO_URI: ${MONGO_URI:?URI Mongo requise}
      REDIS_URL: redis://:${REDIS_PASSWORD:?mot de passe Redis requis}@arene-redis:6379
      JWT_SECRET: ${JWT_SECRET:?secret requis}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?secret requis}
      STORAGE_DRIVER: s3
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:?bucket requis}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:?bucket requis}
      S3_REGION: ${S3_REGION:-eu-west-3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?clé arene-s3 requise}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?clé arene-s3 requise}
      CDN_PUBLIC_URL: ${CDN_PUBLIC_URL:-}
      SES_REGION: ${SES_REGION:-eu-west-3}
      SES_FROM: ${SES_FROM:-}
      # Topic SNS des rebonds/plaintes SES. Vide, le webhook accepte n'importe quel
      # topic AWS correctement signé : à renseigner (voir docker/DEPLOY.md, § 7).
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
      PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?domaine requis}
      API_PUBLIC_URL: ${NUXT_PUBLIC_SITE_URL:?domaine requis}
      DEFAULT_LOCALE: fr
    networks:
      - arene-network
    expose:
      - "4000"
    depends_on:
      - mongodb
      - redis
    mem_limit: 512m
    restart: unless-stopped

  worker:
    image: nejishow/arene-api:${IMAGE_TAG:-latest}
    container_name: arene-worker
    command: ["node", "apps/api/src/worker.js"]
    # Le worker ne sert pas de HTTP : le healthcheck hérité de l'image API
    # (/health sur :4000) le laisserait toujours « unhealthy ».
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const R=require('ioredis');const r=new R(process.env.REDIS_URL,{lazyConnect:true,maxRetriesPerRequest:1,connectTimeout:3000});r.connect().then(()=>r.ping()).then(p=>process.exit(p==='PONG'?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
    environment:
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:?URI Mongo requise}
      REDIS_URL: redis://:${REDIS_PASSWORD:?mot de passe Redis requis}@arene-redis:6379
      JWT_SECRET: ${JWT_SECRET:?secret requis}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?secret requis}
      STORAGE_DRIVER: s3
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:?bucket requis}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:?bucket requis}
      S3_REGION: ${S3_REGION:-eu-west-3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?clé arene-s3 requise}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?clé arene-s3 requise}
      SES_REGION: ${SES_REGION:-eu-west-3}
      SES_FROM: ${SES_FROM:-}
      PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?domaine requis}
    networks:
      - arene-network
    depends_on:
      - mongodb
      - redis
    mem_limit: 384m
    restart: unless-stopped

  # Redis dédié : même logique que vos conteneurs HMS par tenant (mot de passe,
  # mémoire plafonnée), pour ne pas dépendre d'un Redis partagé avec une autre appli.
  redis:
    image: redis:7-alpine
    container_name: arene-redis
    command:
      [
        "redis-server",
        "--requirepass", "${REDIS_PASSWORD:?mot de passe Redis requis}",
        "--maxmemory", "128mb",
        "--maxmemory-policy", "noeviction",
        "--appendonly", "yes"
      ]
    networks:
      - arene-network
    volumes:
      - ${ARENE_DATA_DIR:-/home/ubuntu/arene/data}/redis:/data
    mem_limit: 160m
    restart: unless-stopped

  # MongoDB dédié : aucune donnée partagée avec hms-mongodb (Totalis).
  # Le compte root n'est créé qu'au premier démarrage (dossier de données vide).
  mongodb:
    image: mongo:7
    container_name: arene-mongodb
    command: ["--auth", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: arene_root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?mot de passe root Mongo requis}
    networks:
      - arene-network
    # Accès admin par tunnel SSH uniquement (jamais exposé sur Internet).
    # 27017 est pris par hms-mongodb (Totalis).
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ${ARENE_DATA_DIR:-/home/ubuntu/arene/data}/mongo:/data/db
    mem_limit: 512m
    restart: unless-stopped
