<!--
  L'anneau fendu sur fond plein : l'onglet du navigateur est clair ou sombre
  selon le thème du système, un tracé sans fond y disparaîtrait une fois sur
  deux. Anneau r=14 : circonférence 87,965, deux arcs de 36,982 séparés par 7,
  décalés de 18,491 pour ouvrir à midi et à six heures.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="10" fill="#0b1b2b"/>
  <circle cx="24" cy="24" r="14" fill="none" stroke="#f6f4ef" stroke-width="2.8"
          stroke-dasharray="36.982 7" stroke-dashoffset="18.491"/>
  <path d="M24 10V38" stroke="#e7b23e" stroke-width="2.8" stroke-linecap="round"/>
</svg>
