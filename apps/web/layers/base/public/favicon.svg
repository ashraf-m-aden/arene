<!--
  L'onglet n'a que seize pixels : l'anneau et l'étoile du logo complet s'y
  réduisent en bouillie (anneau de 29/1024, soit moins d'un demi-pixel). On y
  montre donc le cœur de la marque — les deux camps face à face — porté au plus
  grand sur la tuile sombre, qui reste lisible que le thème du système soit
  clair ou sombre. Le logo entier, anneau et étoile compris, sert aux formats
  où il y a la place : `apple-touch-icon.png`, `icon-512.png`, l'en-tête du site.

  Mêmes couleurs et même géométrie que `AreneLogo.vue` : bandes à 45°, pointes à
  ±22 du centre, épaisseur 150, bras de 250.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="224" fill="#0d1117"/>
  <path d="M240 262 L490 512 L240 762 L90 762 L340 512 L90 262 Z" fill="#f5f2ea"/>
  <path d="M784 262 L534 512 L784 762 L934 762 L684 512 L934 262 Z" fill="#f2b33d"/>
</svg>
