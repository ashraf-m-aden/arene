name: Build & Push Docker Images

# Sur main : seulement après un CI vert (lint + tests). Jenkins déploie
# ensuite l'image nejishow/arene-*:<sha court> dès qu'elle est publiée.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    branches:
      - "**staging**" # toutes les branches contenant "staging"
  workflow_dispatch:

jobs:
  build-and-push:
    # Un CI rouge, ou lancé par une pull request, ne publie rien.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            file: docker/api.Dockerfile
          - name: web
            file: docker/web.Dockerfile
    env:
      # workflow_run s'exécute sur la branche par défaut : le commit testé est head_sha.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Compute tags
        id: tags
        run: |
          SHA_SHORT=$(echo "$SHA" | cut -c1-7)
          IMAGE="nejishow/arene-${{ matrix.name }}"

          if [[ "$BRANCH" == "main" ]]; then
            echo "tags=$IMAGE:latest,$IMAGE:$SHA_SHORT" >> $GITHUB_OUTPUT
          else
            echo "tags=$IMAGE:staging,$IMAGE:staging-$SHA_SHORT" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: |
          echo "✅ Image: ${{ matrix.name }}"
          echo "✅ Branch: $BRANCH"
          echo "✅ Pushed tags:"
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/   - /'
