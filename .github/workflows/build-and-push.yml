name: Build & Push Docker Images

on:
  push:
    branches:
      - main
      - "**staging**" # toutes les branches contenant "staging"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            file: docker/api.Dockerfile
          - name: web
            file: docker/web.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="nejishow/arene-${{ matrix.name }}"

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "tags=$IMAGE:latest,$IMAGE:$SHA_SHORT" >> $GITHUB_OUTPUT
          else
            echo "tags=$IMAGE:staging,$IMAGE:staging-$SHA_SHORT" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: |
          echo "✅ Image: ${{ matrix.name }}"
          echo "✅ Branch: ${{ github.ref_name }}"
          echo "✅ Pushed tags:"
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/   - /'
